<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Financeiro</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <header class="header">
        <div class="d-flex align-items-center gap-3">
            <button class="icone config-btn"><i class="fa-solid fa-gear"></i></button>
            <button class="icone perfil-btn"><img src="https://i.pravatar.cc/100" alt="Perfil"></button>
        </div>
    </header>

    <main class="container-fluid">

        <div class="tabs d-flex justify-content-start gap-3 mt-4 px-4">
            <button class="tab-btn active" id="tabGeral">Geral</button>
            <button id="btnMais" class="tab-btn">+</button>
        </div>

        <div class="conteudo-vazio d-flex flex-column justify-content-center align-items-center">
            <div id="btnAddGasto" class="box-add d-flex justify-content-center align-items-center" style="cursor: pointer;">
                <span class="plus-icon">+</span>
            </div>
            <p class="mt-3 texto-vazio">NENHUM GASTO CRIADO</p>
        </div>

        <div id="conteudoCategoria" class="conteudo-categoria d-none">
            <div class="d-flex justify-content-center align-items-center gap-3 mt-4">
                <button id="btnExcluirCategoria" class="btn btn-danger">Excluir Categoria</button>
                <button id="btnAddDentro" class="tab-btn">+</button> 
            </div>

            <div id="tabelaContainer" class="mt-4 px-4">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Descrição</th>
                            <th>Valor</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaGastos">
                        </tbody>
                </table>
            </div>

            <div class="grafico-container">
                <canvas id="graficoGastos" class="mt-4"></canvas>
            </div>     
            
            <div id="cardsPorcentagem" class="d-flex flex-wrap gap-3 mt-4 px-4"></div>
        </div>

    </main>

    <div id="modal" class="modal-custom">
        <div class="modal-box">
            <h5>Nova Categoria</h5>
            <input type="text" id="inputGasto" placeholder="Ex: Lazer, Comida...">
            <div class="modal-actions">
                <button id="btnCancelar" class="btn btn-cancelar">Cancelar</button>
                <button id="btnConcluir" class="btn btn-concluir">Criar</button>
            </div>
        </div>
    </div>

    <div id="modalGasto" class="modal-custom">
        <div class="modal-box">
            <h5>Novo Gasto</h5>
            <input type="text" id="descricaoGasto" placeholder="Descrição">
            <input type="number" id="valorGasto" placeholder="Valor (R$)">
            <div class="modal-actions">
                <button id="cancelarGasto" class="btn btn-cancelar">Cancelar</button>
                <button id="salvarGasto" class="btn btn-concluir">Salvar</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/core/factory.js"></script>
    <script src="js/core/gestor.js"></script>
    <script src="js/adapters/grafico.js"></script>
    <script src="js/ui/renderer.js"></script>
    <script src="js/ui/eventos.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
