<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Financeiro</title>
  
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">

  <!-- ICONES-->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
</head>

<body>

  <!-- 🔝 HEADER -->
  <header class="header">
    <div class="d-flex align-items-center gap-3">
      <button class="icone config-btn"><i class="fa-solid fa-gear"></i></button>
      <button class="icone perfil-btn"><img src="https://i.pravatar.cc/100" alt="Perfil"></button>
    </div>
  </header>

  <!-- 📦 MAIN -->
  <main class="container-fluid">

    <!-- 🔘 TABS -->
    <div class="tabs d-flex justify-content-start gap-3 mt-4 px-4">
      <button class="tab-btn active" id="tabGeral">Geral</button>
      <button id="btnMais" class="tab-btn">+</button>
    </div>

    <!-- 📭 CONTEÚDO VAZIO -->
    <div class="conteudo-vazio d-flex flex-column justify-content-center align-items-center">
      
      <div id="btnAddGasto" class="box-add d-flex justify-content-center align-items-center">
        <span class="plus-icon">+</span>
      </div>

      <p class="mt-3 texto-vazio">NENHUM GASTO CRIADO</p>
    </div>

    <!-- 📊 CONTEÚDO DA CATEGORIA -->
    <div id="conteudoCategoria" class="conteudo-categoria d-none">

      <div class="d-flex justify-content-center align-items-center gap-3 mt-4">

        <!-- botão excluir -->
        <button id="btnExcluirCategoria" class="btn btn-danger">Excluir</button>

        <!-- botão adicionar gasto -->
        <button id="btnAddDentro" class="tab-btn">+</button>
      </div>
      
      <table id="tabelaContainer" class="table mt-4">
        <thead>
          <tr>
            <th>Tipo</th>
            <th>Descrição</th>
            <th>Valor</th>
            <th>Excluir</th>
          </tr>
        </thead>
        <tbody id="tabelaGastos">
        </tbody>
      </table>

      <div class="grafico-container">
        <canvas id="graficoGastos" class="mt-4"></canvas>
      </div>
      
      <div id="cardsPorcentagem" class="d-flex flex-wrap gap-3 mt-4 px-4"></div>
    </div>

  </main>

    <!-- Modal de criar uma tab -->
    <div id="modal" class="modal-custom">
        <div class="modal-box">
            <h5>Criar gasto</h5>
            <input type="text" id="inputGasto" placeholder="Descrição do gasto">
            <div class="modal-actions">
                <button id="btnCancelar" class="btn btn-cancelar">Cancelar</button>
                <button id="btnConcluir" class="btn btn-concluir">Concluir</button>
            </div>
        </div>
    </div>

    <!-- Modal de criar gasto dentro de uma tab nova -->
    <div id="modalGasto" class="modal-custom">

      <div class="modal-box">
        <h5>Novo gasto</h5>

        <input type="text" id="descricaoGasto" placeholder="Descrição">
        <input type="number" id="valorGasto" placeholder="Valor">

        <div class="modal-actions">
          <button id="cancelarGasto" class="btn btn-cancelar">Cancelar</button>
          <button id="salvarGasto" class="btn btn-concluir">Salvar</button>
        </div>
    </div>

</div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
