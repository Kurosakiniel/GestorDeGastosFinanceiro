<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Financeiro</title>
  
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
  
</head>

<body>

  <!-- 🔝 HEADER -->
  <header class="header d-flex justify-content-between align-items-center px-4">
    <div></div>

    <div class="d-flex align-items-center gap-3">
      <span class="icone">⚙️</span>
      <span class="icone">👤</span>
    </div>
  </header>

  <!-- 📦 MAIN -->
  <main class="container-fluid">

    <!-- 🔘 TABS -->
    <div class="tabs d-flex gap-3 mt-4 px-4">
      <button class="tab-btn active">Geral</button>
      <button class="tab-btn">+</button>
    </div>

    <!-- 📭 CONTEÚDO VAZIO -->
    <div class="conteudo-vazio d-flex flex-column justify-content-center align-items-center">
      
      <div class="box-add d-flex justify-content-center align-items-center" id="btnAddGasto" class="box-add">
        +
      </div>

      <p class="mt-3 texto-vazio">NENHUM GASTO CRIADO</p>
    </div>

  </main>

    <div id="modal" class="modal-custom">
        <div class="modal-box">
            <h5>Criar gasto</h5>
            <input type="text" id="inputGasto" placeholder="Nome do gasto">
            <div class="mt-3 d-flex justify-content-end gap-2">
                <button id="btnCancelar" class="btn btn-secondary">Cancelar</button>
                <button id="btnConcluir" class="btn btn-success">Concluir</button>
            </div>
        </div>
    </div>


    <script src="js/script.js"></script>
</body>
</html>
